<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='900' viewBox='0 0 1180 900' role='img' aria-label='Authentication flow'>
<rect width='1180' height='900' fill='#ffffff'/>
<defs><marker id='arrow' markerWidth='9' markerHeight='9' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L8,3 L0,6 z' fill='#334155'/></marker><marker id='arrowback' markerWidth='9' markerHeight='9' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L8,3 L0,6 z' fill='#0d9488'/></marker></defs>
<text x='24' y='34' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' fill='#0f172a' text-anchor='start'>Authentication &amp; Token Lifecycle</text>
<text x='24' y='56' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#475569' text-anchor='start'>Traced from AuthController / AuthService / RefreshTokenService / JwtService / JwtAuthenticationFilter</text>
<rect x='12' y='84' width='156' height='46' rx='8' fill='#0f172a' stroke='#0f172a' stroke-width='1.5'/>
<text x='90.0' y='112.0' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#ffffff' text-anchor='middle'>Client</text>
<line x1='90' y1='130' x2='90' y2='860' stroke='#cbd5e1' stroke-width='1.2' stroke-dasharray='4 4'/>
<rect x='222' y='84' width='156' height='46' rx='8' fill='#0f172a' stroke='#0f172a' stroke-width='1.5'/>
<text x='300.0' y='104.5' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#ffffff' text-anchor='middle'>JwtAuthFilter</text>
<text x='300.0' y='119.5' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#ffffff' text-anchor='middle'>+ RateLimitFilter</text>
<line x1='300' y1='130' x2='300' y2='860' stroke='#cbd5e1' stroke-width='1.2' stroke-dasharray='4 4'/>
<rect x='462' y='84' width='156' height='46' rx='8' fill='#0f172a' stroke='#0f172a' stroke-width='1.5'/>
<text x='540.0' y='104.5' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#ffffff' text-anchor='middle'>Auth / User</text>
<text x='540.0' y='119.5' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#ffffff' text-anchor='middle'>Service</text>
<line x1='540' y1='130' x2='540' y2='860' stroke='#cbd5e1' stroke-width='1.2' stroke-dasharray='4 4'/>
<rect x='682' y='84' width='156' height='46' rx='8' fill='#0f172a' stroke='#0f172a' stroke-width='1.5'/>
<text x='760.0' y='104.5' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#ffffff' text-anchor='middle'>Argon2 +</text>
<text x='760.0' y='119.5' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#ffffff' text-anchor='middle'>UserRepository</text>
<line x1='760' y1='130' x2='760' y2='860' stroke='#cbd5e1' stroke-width='1.2' stroke-dasharray='4 4'/>
<rect x='912' y='84' width='156' height='46' rx='8' fill='#0f172a' stroke='#0f172a' stroke-width='1.5'/>
<text x='990.0' y='104.5' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#ffffff' text-anchor='middle'>RefreshTokenSvc</text>
<text x='990.0' y='119.5' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#ffffff' text-anchor='middle'>+ JwtService</text>
<line x1='990' y1='130' x2='990' y2='860' stroke='#cbd5e1' stroke-width='1.2' stroke-dasharray='4 4'/>
<text x='24' y='150' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#0d9488' text-anchor='start'>① REGISTER  POST /api/v1/auth/register</text>
<line x1='90' y1='174' x2='540' y2='174' stroke='#334155' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='315.0' y='168' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#0f172a' text-anchor='middle'>RegisterRequest (@Valid: 12+ char password)</text>
<line x1='540' y1='208' x2='760' y2='208' stroke='#334155' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='650.0' y='202' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#0f172a' text-anchor='middle'>Argon2 encode(password) + saveAndFlush(user, ROLE_USER)</text>
<line x1='540' y1='242' x2='990' y2='242' stroke='#334155' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='765.0' y='236' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#0f172a' text-anchor='middle'>issueTokens: access+refresh JWT (tokenVersion=0)</text>
<line x1='990' y1='276' x2='540' y2='276' stroke='#0d9488' stroke-width='1.5' stroke-dasharray='5 3' marker-end='url(#arrowback)'/>
<text x='765.0' y='270' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#0f172a' text-anchor='middle'>store SHA-256(refresh) row</text>
<line x1='540' y1='306' x2='90' y2='306' stroke='#0d9488' stroke-width='1.5' stroke-dasharray='5 3' marker-end='url(#arrowback)'/>
<text x='315.0' y='300' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#0f172a' text-anchor='middle'>201 { accessToken, refreshToken, user }</text>
<text x='24' y='346' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#0d9488' text-anchor='start'>② LOGIN  POST /api/v1/auth/login   (constant-time; audited)</text>
<line x1='90' y1='370' x2='540' y2='370' stroke='#334155' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='315.0' y='364' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#0f172a' text-anchor='middle'>LoginRequest { email, password }</text>
<line x1='540' y1='402' x2='760' y2='402' stroke='#334155' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='650.0' y='396' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#0f172a' text-anchor='middle'>findByEmail; ALWAYS Argon2 matches (dummy hash if unknown)</text>
<text x='555' y='434' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#b91c1c' text-anchor='start'>reject uniformly if unknown / disabled / locked; lockout after N fails</text>
<line x1='540' y1='460' x2='990' y2='460' stroke='#334155' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='765.0' y='454' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#0f172a' text-anchor='middle'>on success: clear failures + issueTokens</text>
<line x1='540' y1='490' x2='90' y2='490' stroke='#0d9488' stroke-width='1.5' stroke-dasharray='5 3' marker-end='url(#arrowback)'/>
<text x='315.0' y='484' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#0f172a' text-anchor='middle'>200 { accessToken (15m), refreshToken (7d) }</text>
<text x='24' y='530' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#0d9488' text-anchor='start'>③ AUTHENTICATED REQUEST  e.g. GET /api/v1/users/me</text>
<line x1='90' y1='554' x2='300' y2='554' stroke='#334155' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='195.0' y='548' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#0f172a' text-anchor='middle'>Authorization: Bearer &lt;access&gt;</text>
<line x1='300' y1='586' x2='760' y2='586' stroke='#334155' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='530.0' y='580' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#0f172a' text-anchor='middle'>verify HS256 sig (kid) + type=access</text>
<text x='305' y='616' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#b91c1c' text-anchor='start'>AND tokenVersion == user.tokenVersion AND enabled AND non-locked</text>
<line x1='300' y1='642' x2='90' y2='642' stroke='#0d9488' stroke-width='1.5' stroke-dasharray='5 3' marker-end='url(#arrowback)'/>
<text x='195.0' y='636' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#0f172a' text-anchor='middle'>401 if any check fails (fail-closed)</text>
<text x='24' y='682' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#0d9488' text-anchor='start'>④ REFRESH ROTATION  POST /api/v1/auth/refresh</text>
<line x1='90' y1='706' x2='990' y2='706' stroke='#334155' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='540.0' y='700' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#0f172a' text-anchor='middle'>{ refreshToken }</text>
<text x='770' y='736' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#b91c1c' text-anchor='middle'>validate sig+type+tokenVersion; stored hash non-revoked &amp; non-expired</text>
<line x1='990' y1='762' x2='90' y2='762' stroke='#0d9488' stroke-width='1.5' stroke-dasharray='5 3' marker-end='url(#arrowback)'/>
<text x='540.0' y='756' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#0f172a' text-anchor='middle'>revoke old hash → issue NEW access+refresh</text>
<text x='24' y='802' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#0d9488' text-anchor='start'>⑤ LOGOUT  POST /api/v1/auth/logout  (revocation)</text>
<line x1='90' y1='826' x2='540' y2='826' stroke='#334155' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='315.0' y='820' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#0f172a' text-anchor='middle'>Bearer &lt;access&gt; (authenticated)</text>
<line x1='540' y1='856' x2='990' y2='856' stroke='#334155' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='765.0' y='850' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#0f172a' text-anchor='middle'>deleteAllForUser + user.tokenVersion++</text>
<text x='540' y='884' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' fill='#b91c1c' text-anchor='middle'>→ every previously-issued access token now fails the tokenVersion check</text>
</svg>
