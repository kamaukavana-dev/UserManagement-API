name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      MAVEN_OPTS: -Xmx1g
      # Ensure deterministic profile
      SPRING_PROFILES_ACTIVE: test
      # Provide a safe default secret for validation
      JWT_SECRET: ci-secret-minimum-32-characters-long-1234567890
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & run unit + integration tests
        run: mvn -B clean verify -Pit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image for scan
        run: docker build -t usermanagement-api:ci --cache-from=type=local,src=/tmp/.buildx-cache --cache-to=type=local,dest=/tmp/.buildx-cache-new .

      - name: Move new cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: usermanagement-api:ci
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF (optional)
        if: failure()
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: usermanagement-api:ci
          format: sarif
          output: trivy.sarif
      - name: Upload SARIF to GitHub Code Scanning
        if: failure()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
