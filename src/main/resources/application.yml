spring:
  application:
    name: usermanagement-api

  profiles:
    default: dev

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        jdbc.time_zone: UTC

  data:
    redis:
      repositories:
        enabled: false

  jackson:
    default-property-inclusion: NON_NULL
    time-zone: UTC

  lifecycle:
    timeout-per-shutdown-phase: 30s

  devtools:
    restart:
      enabled: false

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /api/v1
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

# ── Application Config ────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET}
    key-id: ${JWT_KID:current}
    previous-secret: ${JWT_PREVIOUS_SECRET:}
    previous-key-id: ${JWT_PREVIOUS_KID:previous}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_MS:604800000}

  rate-limit:
    backend: ${RATE_LIMIT_BACKEND:local}
    capacity: 20
    refill-tokens: 20
    refill-seconds: 60
    auth-capacity: 5
    auth-refill-tokens: 5
    auth-refill-seconds: 60
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}

  auth:
    max-failed-attempts: 5
    lock-duration-minutes: 15

  security:
    https-enforcement:
      enabled: false

# ── Actuator ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    app:
      name: ${spring.application.name}

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [rid=%X{requestId}] [%X{method} %X{path}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.company.usermanagement: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# ── SpringDoc / Swagger ───────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
